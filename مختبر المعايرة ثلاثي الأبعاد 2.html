<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر المعايرة ثلاثي الأبعاد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--panel:#111c33;--line:#26344f;--tx:#e8eefc;--mut:#8fa1c4;--acc:#f59e3b;--acc2:#5eead4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef2f9;--panel:#fff;--line:#d3dcec;--tx:#14203a;--mut:#5a6b8c;--acc:#d97706;--acc2:#0f766e;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0b1220}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',Tahoma,Arial,sans-serif;line-height:1.5}
.app{display:grid;grid-template-columns:1fr 300px;gap:12px;padding:12px;max-width:1800px;margin:auto}
@media(max-width:860px){.app{grid-template-columns:1fr}}
.logo{max-width:1800px;margin:12px auto 0;padding:0 12px}.logo img{width:100%;display:block;border-radius:14px;background:#fff}
.by{display:block;margin-top:2px;font-size:15px;font-weight:700;color:#f59e3b}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#0b1424;border:1px solid var(--line);height:calc(100vh - 24px);min-height:620px}
@media(max-width:860px){.stage{height:80vh;min-height:480px}}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.title{position:absolute;top:12px;right:16px;text-align:right;pointer-events:none;color:#e8eefc}
.title small{color:#5eead4}.title b{display:block;font-size:24px;font-weight:800}
.hint{position:absolute;top:12px;left:14px;color:#9fb2d4;font-size:13px;pointer-events:none;max-width:200px}
.bar{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 8px}
.btn{font:inherit;font-weight:700;border:1px solid #2b3b58;background:#16233d;color:#e8eefc;padding:9px 14px;border-radius:14px;cursor:pointer}
.btn.main{background:#e8892b;color:#2a1500;border-color:transparent}
.side{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.lab{color:var(--mut);font-size:13px;margin:8px 0 4px}
select{width:100%;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.slot{display:flex;justify-content:space-between;background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:6px;font-size:14px}
.slot b{color:var(--acc2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.stat{background:var(--bg);border-radius:12px;padding:6px;text-align:center}
.stat b{display:block;font-size:20px;font-family:monospace}.stat span{color:var(--mut);font-size:12px}
#msg{min-height:44px;color:var(--acc2);font-weight:700;font-size:14px}
canvas#ch{width:100%;height:auto;display:block}
body.ex{overflow:hidden}
body.ex .stage{position:fixed;inset:0;z-index:50;height:100vh;min-height:0;border-radius:0;border:0}
body.ex .side{position:fixed;top:10px;left:10px;width:290px;max-height:calc(100vh - 20px);overflow:auto;z-index:60}
body.ex.nop .side{display:none}
body.ex .hint{display:none}
</style>
</head>

for(const k in IN){const o=document.createElement('option');o.value=k;o.textContent=IN[k].n;$('in').appendChild(o)}
function resetTit(){cur=0;tgt=0;hit=false;lastKey='';
 if(an){t0=mix(pH(0)).t;hist=ti?[[0,pH(0)]]:[]}else hist=[];
 $('sa').textContent=an?SUB[an].f+' · '+SUB[an].t:'فارغ';
 $('st').textContent=ti?SUB[ti].f+' · '+SUB[ti].t:'فارغة';
 $('info').textContent=an&&ti?`نقطة التكافؤ عند 25 مل و pH عندها ≈ ${pH(25).toFixed(2)}. اختر كاشفًا يتغير لونه قرب هذه القيمة.`:'';
 $('msg').textContent=!an&&!ti?'اسحب قارورة حمض إلى الدورق (أو السحاحة) وقارورة قاعدة إلى الوعاء الآخر.':an&&ti?'تم التعبئة. ابدأ بإضافة المحلول من السحاحة.':'املأ الوعاء الآخر بمادة من النوع المعاكس (حمض مع قاعدة).'}
$('in').onchange=e=>{ind=e.target.value;if(an)t0=mix(pH(0)).t;hit=false;lastKey=''};
$('rst').onclick=()=>{resetTit()};
$('clr').onclick=()=>{an=null;ti=null;resetTit()};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(!ready()){$('msg').textContent='املأ الدورق والسحاحة أولًا بسحب القوارير إليهما.';return}tgt=Math.min(50,tgt+ +b.dataset.v)});

/* ---- 3D ---- */
const cv=$('cv'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(2,devicePixelRatio));
const S=new THREE.Scene();S.background=new THREE.Color(0x0b1424);
const cam=new THREE.PerspectiveCamera(40,1,.1,100);
S.add(new THREE.HemisphereLight(0xcfe3ff,0x223044,.95));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(5,10,8);S.add(dl);
const bench=new THREE.Mesh(new THREE.BoxGeometry(16,.4,9),new THREE.MeshStandardMaterial({color:0x5b6f80,roughness:.6}));bench.position.y=-.2;S.add(bench);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(40,24),new THREE.MeshStandardMaterial({color:0x24364a}));wall.position.set(0,8,-4.5);S.add(wall);
const grid=new THREE.GridHelper(40,40,0x3b536d,0x2f455b);grid.rotation.x=Math.PI/2;grid.position.set(0,8,-4.48);S.add(grid);
const glass=new THREE.MeshPhysicalMaterial({color:0xcfe8ff,transparent:true,opacity:.22,roughness:.05,side:THREE.DoubleSide,depthWrite:false});
const metal=new THREE.MeshStandardMaterial({color:0x8d98a6,metalness:.7,roughness:.4});
const stir=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.3,.5,40),new THREE.MeshStandardMaterial({color:0x2a3340}));stir.position.y=.25;S.add(stir);
const FY=.5;
const Rf=y=>y<=2.2?1.6-1.15*(y/2.2):.45;
function prof(h){const p=[new THREE.Vector2(0,0)];for(let y=0;y<h;y+=.1)p.push(new THREE.Vector2(Rf(y)-.03,y));p.push(new THREE.Vector2(Rf(h)-.03,h),new THREE.Vector2(0,h));return p}
const fg=new THREE.Group();fg.position.y=FY;S.add(fg);
const fp=[];for(let y=0;y<=3.2+1e-6;y+=.1)fp.push(new THREE.Vector2(Rf(y),y));
fg.add(new THREE.Mesh(new THREE.LatheGeometry(fp,48),glass));
const lm=new THREE.MeshPhysicalMaterial({color:0xcde0f0,transparent:true,opacity:.88,roughness:.1});
let liq=new THREE.Mesh(new THREE.LatheGeometry(prof(1),48),lm);fg.add(liq);liq.visible=false;
const lh=V=>.4+(25+V)/75*1.9;
const rod=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,12,12),metal);rod.position.set(-3,6,0);S.add(rod);
const sb=new THREE.Mesh(new THREE.BoxGeometry(2.4,.3,2.2),metal);sb.position.set(-3,.15,0);S.add(sb);
const arm=new THREE.Mesh(new THREE.BoxGeometry(3,.18,.3),metal);arm.position.set(-1.5,8.2,0);S.add(arm);
const BY=4.9,BL=6;
const bt=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,BL,24,1,true),glass);bt.position.set(0,BY+BL/2,0);S.add(bt);
const bm=new THREE.MeshPhysicalMaterial({color:0xb9d3ee,transparent:true,opacity:.85});
const bl=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,BL,24),bm);S.add(bl);bl.visible=false;
for(let i=0;i<=5;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(.225,.012,6,24),new THREE.MeshBasicMaterial({color:0xcfe0f5}));r.rotation.x=Math.PI/2;r.position.set(0,BY+BL-i*BL/5,0);S.add(r)}
const tip=new THREE.Mesh(new THREE.CylinderGeometry(.04,.2,.6,16,1,true),glass);tip.position.set(0,BY-.35,0);S.add(tip);
const sc=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.3,16),new THREE.MeshStandardMaterial({color:0xe8892b}));sc.rotation.z=Math.PI/2;sc.position.set(0,BY+.05,0);S.add(sc);
const hd=new THREE.Mesh(new THREE.BoxGeometry(.7,.1,.1),new THREE.MeshStandardMaterial({color:0xe8892b}));hd.position.set(0,BY+.05,.3);S.add(hd);
const drops=[],dm=new THREE.MeshPhysicalMaterial({color:0xb9d3ee,transparent:true,opacity:.9});
/* bottles */
const bottles=[];
function tag(k){const s=SUB[k],c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');
 x.fillStyle=s.a?'#b45309':'#1d4ed8';x.beginPath();x.roundRect?x.roundRect(6,6,244,116,22):x.rect(6,6,244,116);x.fill();
 x.fillStyle='#fff';x.textAlign='center';x.font='bold 54px Tajawal,Arial';x.fillText(s.f,128,66);x.font='bold 30px Tajawal,Arial';x.fillText(s.t,128,106);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));sp.scale.set(2,1,1);sp.position.y=2.6;return sp}
Object.keys(SUB).forEach((k,i)=>{const s=SUB[k],g=new THREE.Group(),col=s.a?0xf0a030:0x4f8df0;
 const m=new THREE.MeshPhysicalMaterial({color:col,transparent:true,opacity:.8,roughness:.15});
 const b=new THREE.Mesh(new THREE.CylinderGeometry(.55,.6,1.3,24),m);b.position.y=.65;
 const n=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,.4,16),m);n.position.y=1.5;
 const cp=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.2,16),new THREE.MeshStandardMaterial({color:0x222a36}));cp.position.y=1.8;
 g.add(b,n,cp,tag(k));g.position.set(-5.5+i*2.2,0,2.9);g.userData={key:k,home:g.position.clone(),col};bottles.push(g);S.add(g)});
const stream=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,1,8),dm);stream.visible=false;S.add(stream);
/* orbit */
let th=.15,ph=1.3,rad=13.5;const tg=new THREE.Vector3(-.4,4.4,0);
function place(){cam.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tg)}
function size(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<1?62:40;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
/* interaction */
const rc=new THREE.Raycaster(),pl=new THREE.Plane(),V3=THREE.Vector3;
let dr=false,lx=0,ly=0,drag=null,off=new V3(),moved=0,sel=null,pour=null,auto=true;
function ray(e){const r=cv.getBoundingClientRect();rc.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-((e.clientY-r.top)/r.height)*2+1},cam)}
function bottleAt(){const h=rc.intersectObjects(bottles,true)[0];if(!h)return null;let o=h.object;while(o&&!o.userData.key)o=o.parent;return o}
function vesselAt(){return rc.intersectObjects([fg,bt,bl,tip],true)[0]?(rc.intersectObjects([fg],true)[0]?'flask':'bur'):null}
function home(g){g.position.copy(g.userData.home);g.rotation.set(0,0,0);g.scale.setScalar(1)}
cv.onpointerdown=e=>{auto=false;cv.setPointerCapture(e.pointerId);lx=e.clientX;ly=e.clientY;moved=0;ray(e);const b=pour?null:bottleAt();
 if(b){drag=b;pl.setFromNormalAndCoplanarPoint(cam.getWorldDirection(new V3()).negate(),b.position);const p=new V3();rc.ray.intersectPlane(pl,p);off.copy(b.position).sub(p)}else dr=true};
cv.onpointermove=e=>{moved+=Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly);
 if(drag){ray(e);const p=new V3();if(rc.ray.intersectPlane(pl,p)){drag.position.copy(p.add(off));drag.position.y=Math.max(0,drag.position.y)}}
 else if(dr){th-=(e.clientX-lx)*.008;ph=Math.min(1.75,Math.max(.5,ph-(e.clientY-ly)*.006))}
 lx=e.clientX;ly=e.clientY};
cv.onpointerup=e=>{ray(e);
 if(drag){const g=drag;drag=null;
  if(moved>8){const d1=g.position.distanceTo(new V3(0,FY+2.5,0)),d2=g.position.distanceTo(new V3(0,BY+BL*.8,0));
   if(Math.min(d1,d2)<3.4)dropOn(g,d1<d2?'flask':'bur');else home(g)}
  else{if(sel)sel.scale.setScalar(1);sel=sel===g?null:g;if(sel)sel.scale.setScalar(1.15)}}
 else if(dr&&moved<6&&sel&&!pour){const v=vesselAt();if(v){const g=sel;sel=null;g.scale.setScalar(1);dropOn(g,v)}}
 dr=false};
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(48,Math.max(5,rad*(1+e.deltaY*.0015)))},{passive:false});
function dropOn(g,name){const k=g.userData.key,other=name==='flask'?ti:an;
 if(other&&SUB[other].a===SUB[k].a){home(g);$('msg').textContent='اختر مادة من النوع المعاكس: حمض مع قاعدة.';return}
 pour={g,name,k,t:0,from:g.position.clone(),done:false}}
function mouth(n){return n==='flask'?new V3(0,FY+3.2,0):new V3(0,BY+BL+.1,0)}
function doPour(dt){const P=pour;P.t+=dt;const u=P.t/2.6,g=P.g;
 const a=u<.3?u/.3:u<.8?1:Math.max(0,(1-u)/.2),ease=a*a*(3-2*a),th2=ease*1.9;
 const nv=new V3(-Math.sin(th2)*1.9,Math.cos(th2)*1.9,0),mp=mouth(P.name),base=mp.clone().sub(nv).add(new V3(0,.4,0));
 g.position.copy((u<.5?P.from:g.userData.home).clone().lerp(base,ease));g.rotation.z=th2;
 if(u>.35&&!P.done){P.done=true;if(P.name==='flask')an=P.k;else ti=P.k;const f=ffl,b=fb;resetTit();ffl=f;fb=b;lastKey=''}
 const on=u>.35&&u<.8;stream.visible=on;
 if(on){const top=mp.y,bot=P.name==='flask'?FY+lh(0)*Math.max(ffl,.2):BY+BL*Math.max(fb,.05);
  stream.scale.set(1,top-bot,1);stream.position.set(mp.x,(top+bot)/2,0);dm.color.setHex(g.userData.col)}
 if(u>=1){home(g);pour=null;stream.visible=false}}
/* loop */
let last=performance.now(),lastKey='';
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(pour)doPour(dt);
 const tf=an?1:0,tb=ti?1:0;ffl+=Math.sign(tf-ffl)*Math.min(Math.abs(tf-ffl),dt*.7);fb+=Math.sign(tb-fb)*Math.min(Math.abs(tb-fb),dt*.7);
 const flow=ready()&&tgt-cur>.001;
 if(flow){cur=Math.min(tgt,cur+Math.max(.6,(tgt-cur)*2)*dt*(tgt-cur>.6?3:1));
  if(Math.random()<dt*7){const d=new THREE.Mesh(new THREE.SphereGeometry(.07,10,10),dm);d.userData.v=0;d.position.set(0,BY-.6,0);S.add(d);drops.push(d)}
  const l=hist[hist.length-1][0];if(cur-l>=.25||cur===tgt)hist.push([cur,pH(cur)])}
 hd.rotation.y=flow?Math.PI/2:0;
 for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.userData.v+=dt*14;d.position.y-=d.userData.v*dt;if(d.position.y<FY+lh(cur)*ffl){S.remove(d);drops.splice(i,1)}}
 const key=[cur.toFixed(3),ffl.toFixed(2),fb.toFixed(2),an,ti,ind].join();
 if(key!==lastKey){lastKey=key;
  const hL=an?lh(cur)*ffl:0;liq.visible=hL>.06;
  if(liq.visible){liq.geometry.dispose();liq.geometry=new THREE.LatheGeometry(prof(hL),48);const p=pH(cur),m=mix(p);lm.color.setRGB(m.c[0]/255,m.c[1]/255,m.c[2]/255);lm.opacity=ind==='p'&&m.t<.2?.6:.88}
  const f=Math.max(0,(50-cur)/50)*fb;bl.visible=f>.005;bl.scale.y=Math.max(.001,f);bl.position.set(0,BY+BL*f/2,0);
  if(ti){const c=SUB[ti].a?[185,215,240]:[200,190,235];bm.color.setRGB(c[0]/255,c[1]/255,c[2]/255);dm.color.copy(bm.color)}
  ui()}
 if(auto)th+=.0005;
 place();R.render(S,cam);requestAnimationFrame(frame)}
function ui(){const M=$('msg');$('vol').textContent=cur.toFixed(1);
 if(!an){$('ph').textContent='—';$('col').textContent='—';chart();return}
 const p=pH(cur),m=mix(p);$('ph').textContent=p.toFixed(2);const c=$('col');c.textContent=lbl(p);c.style.color=`rgb(${m.c.map(Math.round)})`;
 if(ready()&&!hit&&cur>0&&Math.abs(m.t-t0)>.5){hit=true;M.textContent=`تغيّر لون الكاشف عند ${cur.toFixed(1)} مل (نقطة النهاية). قارنها بنقطة التكافؤ عند 25 مل.`}
 else if(ready()&&!hit&&cur>0)M.textContent=cur<25?'ما زلنا قبل نقطة التكافؤ، أضف بحذر.':'تجاوزنا نقطة التكافؤ ولم يتغيّر لون هذا الكاشف، جرّب كاشفًا آخر.';
 chart()}
function chart(){const c=$('ch'),x=c.getContext('2d'),W=c.width,H=c.height,L=40,Rr=10,T=12,B=32,cs=getComputedStyle(document.documentElement),tx=cs.getPropertyValue('--mut'),ac=cs.getPropertyValue('--acc'),ln=cs.getPropertyValue('--line'),a2=cs.getPropertyValue('--acc2');
 const X=v=>L+v/50*(W-L-Rr),Y=p=>H-B-p/14*(H-T-B);x.clearRect(0,0,W,H);x.font='13px Tajawal,Arial';x.fillStyle=tx;x.strokeStyle=ln;x.lineWidth=1;
 for(let p=0;p<=14;p+=2){x.beginPath();x.moveTo(L,Y(p));x.lineTo(W-Rr,Y(p));x.stroke();x.fillText(p,12,Y(p)+4)}
 for(let v=0;v<=50;v+=10)x.fillText(v,X(v)-6,H-14);x.fillText('الحجم (مل)',W/2-24,H-1);
 if(!an||!ti)return;
 x.setLineDash([4,4]);x.strokeStyle=tx;x.beginPath();x.moveTo(X(25),T);x.lineTo(X(25),H-B);x.stroke();x.setLineDash([]);
 x.strokeStyle=ac;x.lineWidth=3;x.beginPath();hist.forEach((q,i)=>i?x.lineTo(X(q[0]),Y(q[1])):x.moveTo(X(q[0]),Y(q[1])));x.stroke();
 x.fillStyle=a2;x.beginPath();x.arc(X(cur),Y(pH(cur)),6,0,7);x.fill()}
function setEx(on){document.body.classList.toggle('ex',on);if(!on)document.body.classList.remove('nop');$('ex').textContent=on?'تصغير':'⛶ توسيع المختبر';$('pn').style.display=on?'':'none';$('pn').textContent='إخفاء اللوحة';
 try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}size()}
$('ex').onclick=()=>setEx(!document.body.classList.contains('ex'));
$('pn').onclick=()=>{const n=document.body.classList.toggle('nop');$('pn').textContent=n?'إظهار اللوحة':'إخفاء اللوحة'};
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('ex'))setEx(false)});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('ex'))setEx(false)});
new ResizeObserver(size).observe(cv.parentElement);
const zoom=f=>{rad=Math.min(48,Math.max(5,rad*f))};
$('zo').onclick=()=>zoom(1.25);$('zi').onclick=()=>zoom(.8);
const pts=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){if(drag)home(drag);drag=null;dr=false;const a=[...pts.values()];pd=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){const a=[...pts.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(d>0&&pd>0)zoom(pd/d);pd=d}});
const up=e=>pts.delete(e.pointerId);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
resetTit();requestAnimationFrame(frame);
</script>
